<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<title>2048</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- 背景 -->
<div class="scene">
  <div class="cloud cloud-a"></div>
  <div class="cloud cloud-b"></div>
</div>

<!-- 主体 -->
<div class="app">

  <div class="header">
    <h1 class="title">2048</h1>
    <div class="scores">
      <div class="score">
        <span class="k">得分</span>
        <span class="v" id="score">0</span>
      </div>
      <div class="score gold">
        <span class="k">最高</span>
        <span class="v" id="best">0</span>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn new-game" id="btnNew" type="button">新游戏</button>
    <button class="btn undo" id="btnUndo" type="button" disabled>撤销</button>
  </div>

  <div class="board-wrap">
    <div class="board" id="board">
      <div class="board-mask" id="mask" hidden>
        <div class="big" id="maskBig"></div>
        <div class="sub" id="maskSub"></div>
        <div class="acts">
          <button class="btn yes" id="btnMaskMain" type="button"></button>
          <button class="btn no" id="btnMaskSub" type="button">继续</button>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">方向键 / 滑动 移动方块</div>

</div>

<!-- 新游戏确认（页面内，不用原生 confirm） -->
<div class="modal" id="modal" hidden>
  <div class="panel">
    <h2>要重开吗？</h2>
    <p>当前这局的分数和棋盘会一起清掉，撤销也回不来。</p>
    <div class="acts">
      <button class="btn no" id="btnCancel" type="button">再想想</button>
      <button class="btn yes" id="btnConfirm" type="button">重开一局</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/game.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
